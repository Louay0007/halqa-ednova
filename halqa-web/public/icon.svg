          stroke-linecap="round" stroke-dasharray="760 70" transform="rotate(-58 256 256)"/>
  <!-- three seats around the table -->
  <circle cx="256" cy="256" r="34" fill="#f4f7f7"/>
  <circle cx="256" cy="140" r="22" fill="#d68a24"/>
  <circle cx="360" cy="316" r="22" fill="#d68a24"/>
  <circle cx="152" cy="316" r="22" fill="#d68a24"/>
</svg>
